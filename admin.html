<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAU 網站後台</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f3ef; color: #001b3d; }
    main { width: min(620px, calc(100% - 40px)); background: #fff; padding: 44px; box-shadow: 0 20px 60px rgba(0,27,61,.12); }
    h1 { margin: 0 0 14px; font-size: 30px; }
    p { line-height: 1.8; color: #536071; }
    a.button { display: inline-block; margin-top: 12px; padding: 14px 24px; background: #001b3d; color: #fff; text-decoration: none; }
    small { display: block; margin-top: 22px; color: #7b8490; }
  </style>
</head>
<body>
  <main>
    <h1>KAU 網站內容後台</h1>
    <p>使用 GitHub 帳號登入 Pages CMS，即可用表單修改公司資料、首頁、產品與新聞。儲存後會自動提交到 GitHub 並重新發布網站。</p>
    <a class="button" href="https://app.pagescms.org/" target="_blank" rel="noopener">開啟內容後台</a>
    <small>第一次使用時，請安裝 Pages CMS GitHub App，並只授權 <strong>kau-jp.github.io</strong> 儲存庫。</small>
  </main>
</body>
</html>
