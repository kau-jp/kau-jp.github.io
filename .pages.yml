media:
  input: media
  output: /media

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"

content:
  - name: site
    label: KAU 網站內容
    type: file
    path: content/site.json
    format: json
    fields:
      - name: global
        label: 共用設定
        type: object
        fields:
          - { name: company_name, label: 公司名稱, type: string }
          - { name: postal_code, label: 郵遞區號, type: string }
          - { name: address_line_1, label: 地址第一行, type: string }
          - { name: address_line_2, label: 地址第二行, type: string }
          - { name: phone, label: 電話, type: string }
          - { name: email, label: Email, type: string }
          - { name: hours, label: 營業時間, type: string }
          - { name: access, label: 交通方式, type: string }
          - { name: contact_url, label: 聯絡表單網址, type: string }
          - { name: amazon_url, label: Amazon 商店網址, type: string }
          - { name: rakuten_url, label: 樂天商店網址, type: string }

      - name: home
        label: 首頁
        type: object
        fields:
          - { name: hero_eyebrow, label: 首頁小標, type: string }
          - { name: hero_line_1, label: 首頁主標第一行, type: string }
          - { name: hero_accent, label: 首頁金色文字, type: string }
          - { name: hero_suffix, label: 首頁主標結尾, type: string }
          - { name: hero_subtitle, label: 首頁說明, type: text }
          - { name: hero_image, label: 首頁主圖, type: image, required: false }
          - { name: philosophy, label: 品牌理念, type: text }
          - { name: showcase_title, label: 精選商品標題, type: string }
          - name: showcase
            label: 首頁精選商品
            type: object
            list:
              min: 5
              max: 5
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - { name: category, label: 分類, type: string }
              - { name: name, label: 商品名稱, type: string }
              - { name: price, label: 價格, type: string }
              - { name: description, label: 簡短說明, type: string }
              - { name: image, label: 商品圖片, type: image, required: false }
          - { name: feature_eyebrow, label: 主打商品小標, type: string }
          - { name: feature_title, label: 主打商品標題, type: string }
          - { name: feature_description, label: 主打商品說明, type: text }
          - { name: feature_image, label: 主打商品圖片, type: image, required: false }
          - name: values
            label: 三項品牌價值
            type: object
            list:
              min: 3
              max: 3
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: 標題, type: string }
              - { name: description, label: 說明, type: text }
          - { name: cta_line_1, label: 聯絡區標題第一行, type: string }
          - { name: cta_accent, label: 聯絡區強調文字, type: string }
          - { name: cta_suffix, label: 聯絡區標題結尾, type: string }
          - { name: cta_description, label: 聯絡區說明, type: text }
          - { name: cta_image, label: 聯絡區背景圖, type: image, required: false }

      - name: about
        label: 公司介紹
        type: object
        fields:
          - { name: statement, label: 公司主張, type: text }
          - name: principles
            label: 三項理念
            type: object
            list:
              min: 3
              max: 3
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: label, label: 英文小標, type: string }
              - { name: title, label: 標題, type: string }
              - { name: description, label: 說明, type: text }
          - { name: craft_title, label: 製作理念標題, type: string }
          - { name: craft_paragraph_1, label: 製作理念第一段, type: text }
          - { name: craft_paragraph_2, label: 製作理念第二段, type: text }
          - { name: craft_image, label: 製作理念圖片, type: image, required: false }
          - name: profile
            label: 公司資料
            type: object
            fields:
              - { name: company, label: 公司名稱, type: string }
              - { name: founded, label: 成立時間, type: string }
              - { name: ceo, label: 代表人, type: string }
              - { name: capital, label: 資本額, type: string }
              - { name: address, label: 地址, type: string }
              - { name: business, label: 營業項目, type: text }
              - { name: employees, label: 員工人數, type: string }
              - { name: bank, label: 往來銀行, type: string }
          - name: history
            label: 公司沿革
            type: object
            list:
              min: 5
              max: 5
              collapsible:
                collapsed: true
                summary: "{year} {title}"
            fields:
              - { name: year, label: 年份, type: string }
              - { name: title, label: 標題, type: string }
              - { name: description, label: 說明, type: text }
          - { name: map_image, label: 地圖圖片, type: image, required: false }

      - name: products
        label: 產品頁
        type: object
        fields:
          - { name: lead, label: 頁首說明, type: text }
          - name: items
            label: 產品清單
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: category_code
                label: 分類代碼
                type: select
                options:
                  values:
                    - { name: office, label: Office }
                    - { name: study, label: Study }
                    - { name: exec, label: Executive }
                    - { name: acc, label: Accessory }
              - { name: category_label, label: 顯示分類, type: string }
              - { name: name, label: 商品名稱, type: string }
              - { name: description, label: 商品說明, type: string }
              - { name: features, label: 特色（逗號分隔）, type: string }
              - { name: price, label: 價格, type: string }
              - { name: amazon_url, label: Amazon 商品網址, type: string }
              - { name: rakuten_url, label: 樂天商品網址, type: string }
              - { name: image, label: 商品圖片, type: image, required: false }
          - { name: banner_title, label: 主打橫幅標題, type: string }
          - { name: banner_description, label: 主打橫幅說明, type: text }
          - { name: banner_image, label: 主打橫幅圖片, type: image, required: false }
          - { name: bulk_title, label: 法人服務標題, type: string }
          - { name: bulk_description, label: 法人服務說明, type: text }

      - name: news
        label: 最新消息
        type: object
        fields:
          - name: featured
            label: 置頂消息
            type: object
            fields:
              - { name: date, label: 日期, type: string }
              - { name: category, label: 分類, type: string }
              - { name: title, label: 標題, type: string }
              - { name: summary, label: 摘要, type: text }
              - { name: url, label: 連結, type: string }
              - { name: image, label: 圖片, type: image, required: false }
          - name: items
            label: 消息清單
            type: object
            list:
              min: 7
              max: 7
              collapsible:
                collapsed: true
                summary: "{date} {title}"
            fields:
              - { name: date, label: 日期, type: string }
              - name: category_code
                label: 分類代碼
                type: select
                options:
                  values:
                    - { name: product, label: 製品 }
                    - { name: event, label: 展示會 }
                    - { name: info, label: お知らせ }
              - { name: category, label: 顯示分類, type: string }
              - { name: title, label: 標題, type: string }
              - { name: url, label: 連結, type: string }
